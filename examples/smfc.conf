#
#   Radiatore example smfc.conf (Supermicro X10DRL-CT, 2x E5-2690 v4, passive Tesla P100 in a VM)
#   Full annotated default config: the smfc.conf that ships with smfc
#
#   Zone 0 = FAN1-FAN6 (CPUs + system), zone 1 = FANA/FANB (P100 only).
#   Measured 2026-10-10: at 30% duty zone 0 fans run ~1000 RPM, BMC low
#   threshold is 700 RPM, so zone 0 never goes below 35%.
#

[Ipmi]
command=/usr/bin/ipmitool
fan_mode_delay=10
fan_level_delay=2
platform_name=auto
enforce_fan_mode=1
# Fans go to 100% whenever smfc exits (fail-safe)
exit_level=100

# CPU zone: hottest CPU drives zone 0
[CPU]
# Zone 0 fans resonate at 55-60% duty (sweep 2026-10-11); user max is 70%.
# Exact per-degree levels (steps = degrees between first and last point): 35/40/45/50, jump to 65, 70, 100% emergency >= 78C.
enabled=1
ipmi_zone=0
temp_calc=2
sensitivity=3.0
polling=2
steps=32
min_temp=40.0
max_temp=70.0
min_level=35
max_level=100
smoothing=1
error_tolerance=3

# Only SSDs in this box, and zone 1 belongs to the GPU
control_function=45-35, 46-40, 50-40, 51-45, 55-45, 56-50, 60-50, 61-65, 70-65, 71-70, 77-70, 78-100
[HD]
enabled=0

# GPU zone: P100 temp read from the GPU VM by /usr/local/bin/smfc-gpu-temp (SSH, forced-command key).
# The wrapper prints 90C on any failure (VM down, timeout), above max_temp -> zone 1 at 100%.
# P100 slowdown is 82C, shutdown 85C, so fans reach 100% by 75C.
[GPU]
enabled=1
ipmi_zone=1
gpu_type=nvidia
temp_calc=2
sensitivity=2.0
polling=5
steps=5
min_temp=45.0
max_temp=75.0
min_level=35
max_level=100
smoothing=1
error_tolerance=3
gpu_device_ids=0
nvidia_smi_path=/usr/local/bin/smfc-gpu-temp

# Chassis boost: zone 0 (FAN1-6) also follows the GPU temp, gentler curve, max 70%.
# Zone 0 is shared with [CPU]; smfc applies whichever level is higher.
# Fail-safe reading (90C, VM off) puts zone 0 at 70%.
[GPU:1]
# Same resonance rule for the GPU chassis boost on zone 0: never 55-60%, max 70% (fail-safe 90C -> 70%).
enabled=1
ipmi_zone=0
gpu_type=nvidia
temp_calc=2
sensitivity=2.0
polling=5
steps=14
control_function=60-35, 61-40, 64-40, 65-45, 67-45, 68-50, 69-50, 70-65, 74-65, 75-70
smoothing=1
error_tolerance=3
gpu_device_ids=0
nvidia_smi_path=/usr/local/bin/smfc-gpu-temp

# Was zone 1 at fixed 50% until task 5 (see smfc.conf.pre-task5.bak)
[CONST]
enabled=0
